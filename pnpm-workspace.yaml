catalog:
    vite: npm:@voidzero-dev/vite-plus-core@8.3.8001
    vite-plus: 1.8.0

overrides:
    vite: 'catalog:'
    'minimatch@>=7.0.0 <11.0.1': ^11.0.1

peerDependencyRules:
    allowAny:
        - vite
    allowedVersions:
        vite: '*'

allowBuilds:
    esbuild: false

ignoredBuiltDependencies:
    - '@tailwindcss/oxide'
    - esbuild
    - unrs-resolver

minimumReleaseAge: 1440
minimumReleaseAgeExclude:
    - '@enonic/ui'
